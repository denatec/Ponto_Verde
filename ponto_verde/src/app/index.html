<!doctype html>
<html lang="pt">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente Virtual — Ponto Verde</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="assistente" aria-label="Assistente virtual Ponto Verde">

  </main>

</html>
